name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# DEPENDENCY INSTALL IS THE DOMINANT COST OF EVERY JOB HERE — measured
# 2026-09-03 over 12 successful runs. Per-step timings: the actual work each
# job does is small and stable (web suite 12s in every run sampled, data suite
# 9-14s), while `npm install` ranged 27s -> 375s across the same runs and moved
# in lockstep across all four jobs. `setup-node`'s `cache: npm` only caches the
# npm download cache (~/.npm); it still relinks node_modules every run.
#
# So node_modules itself is cached, keyed on the lockfile hash, and `npm ci`
# runs only on a miss. Any package-lock.json change busts the key, so a stale
# tree cannot survive a dependency change.
#
# NOTE ON CACHE SCOPE: Actions caches written on a branch are visible to that
# branch and to PRs targeting it; caches written on the default branch are
# visible everywhere. So the first run after this lands is a miss by
# definition, and the saving shows from the second run onward.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            data/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Typecheck web
        run: npm run -w web typecheck
      - name: Typecheck data
        run: npm run -w data typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize test runs across PRs — the suite resets state on the
    # shared test Supabase project; parallel runs would race.
    concurrency:
      group: test-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            data/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run data test suite (against isolated test project)
        env:
          # GitHub repo secrets — populate with the values from
          # data/.env.test (same shape as data/.env.test.example).
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          # Dummy value — the suite never reaches Typesense. It only satisfies the
          # module-load requireEnv("TYPESENSE_COLLECTION") in sync-typesense.ts,
          # which materialize.ts imports transitively. Deliberately NOT a code
          # default: a silent "places" fallback is the cross-env clobber this PR
          # fixes, so the requirement stays enforced and CI supplies the value.
          TYPESENSE_COLLECTION: places_ci
        run: npm run -w data test

  test-web:
    # Separate from `test` on purpose. That job is serialized on a shared test
    # Supabase project and carries its secrets; the web suite needs neither, so
    # it must not inherit that queue — and a data-side failure should not hide
    # the web result (or vice versa). "Needs no network/env" is measured, not
    # assumed: the suite passes 714/714 with globalThis.fetch replaced by a
    # thrower, and passes here with no secrets wired.
    #
    # This job is a REQUIRED status check on main — added to ruleset 19629589
    # on 2026-09-03, alongside `typecheck`, `test` and `build`. Renaming the job
    # renames the check context and silently un-requires it; update the ruleset
    # in the same change if you ever rename it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            data/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run web test suite
        run: npm run -w web test

  build:
    # The gate that matches production. `next build` catches RSC boundary
    # errors, 'use client' violations, route-type mismatches, and static-gen
    # failures that tsc alone cannot see. A non-zero exit fails the check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            data/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # No env vars: a clean production build with every .env* absent exits 0.
      # All env access is lazy/runtime-guarded and static generation falls back
      # (e.g. the getAlaskaTrip snapshot). Do NOT stub env here — if a future
      # change makes the build require a var, add it as a repo secret and wire
      # it below rather than faking a value.
      - name: Build web (production gate)
        run: cd web && npx next build
